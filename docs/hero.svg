<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Draw.io mxGraph Skill for Codex</title>
  <desc id="desc">Natural language becomes a validated editable Draw.io architecture diagram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#142b4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb13b"/>
      <stop offset="1" stop-color="#f08705"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7fd3ff"/>
    </marker>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="70" r="190" fill="#1d4d78" opacity=".26"/>
  <circle cx="92" cy="610" r="240" fill="#f08705" opacity=".08"/>

  <g transform="translate(70 78)">
    <rect width="70" height="70" rx="17" fill="url(#accent)" filter="url(#shadow)"/>
    <path d="M20 23h30v24H20z M27 17v12 M43 17v12 M27 41v12 M43 41v12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="31" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">Draw.io mxGraph Skill</text>
    <text x="92" y="60" fill="#a9c9e5" font-family="Inter,Arial,sans-serif" font-size="17">for Codex · editable by design</text>
  </g>

  <text x="70" y="230" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="750">From natural language</text>
  <text x="70" y="286" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="750">to editable architecture.</text>
  <text x="70" y="340" fill="#a9c9e5" font-family="Inter,Arial,sans-serif" font-size="21">Validated mxGraph XML · smart icons · incremental edits</text>

  <g transform="translate(70 390)" font-family="Inter,Arial,sans-serif">
    <rect width="360" height="142" rx="20" fill="#0d2038" stroke="#315777" stroke-width="2"/>
    <text x="26" y="37" fill="#7fd3ff" font-size="14" font-weight="700">PROMPT</text>
    <text x="26" y="72" fill="#fff" font-size="19">“Build an Agent platform with</text>
    <text x="26" y="101" fill="#fff" font-size="19">CRM, ERP and ticketing.”</text>
  </g>

  <path d="M457 461 H535" fill="none" stroke="#7fd3ff" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(560 170)" font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect width="570" height="360" rx="26" fill="#f7fbff"/>
    <text x="28" y="42" fill="#18324d" font-size="16" font-weight="700">EDITABLE .DRAWIO</text>

    <g fill="#fff" stroke-width="2">
      <rect x="36" y="86" width="108" height="108" rx="18" stroke="#5aa7db"/>
      <rect x="226" y="86" width="108" height="108" rx="18" stroke="#f08705"/>
      <rect x="416" y="54" width="108" height="84" rx="18" stroke="#7b68ee"/>
      <rect x="416" y="166" width="108" height="84" rx="18" stroke="#39a96b"/>
      <rect x="226" y="246" width="108" height="84" rx="18" stroke="#d95575"/>
    </g>

    <g font-size="15" font-weight="700" text-anchor="middle">
      <text x="90" y="145" fill="#24577a">USER</text>
      <text x="280" y="145" fill="#9a5200">AGENT</text>
      <text x="470" y="103" fill="#5141a6">CRM</text>
      <text x="470" y="215" fill="#247947">ERP</text>
      <text x="280" y="295" fill="#a32f4d">TICKETS</text>
    </g>

    <g fill="none" stroke="#527a9c" stroke-width="3" marker-end="url(#arrow)">
      <path d="M144 140 H214"/>
      <path d="M334 124 H374 V96 H404"/>
      <path d="M334 156 H374 V208 H404"/>
      <path d="M280 194 V234"/>
    </g>

    <rect x="31" y="348" width="508" height="1" fill="#d4e4ef"/>
  </g>
</svg>
