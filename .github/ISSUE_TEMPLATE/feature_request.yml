name: Feature request
description: Suggest a useful diagram capability, icon mapping, validation rule, or example.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What diagram task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired input and output with a concrete example.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Diagram generation
        - Incremental editing
        - Connector routing or layout
        - Icons
        - XML validation
        - Example library
        - Documentation
    validations:
      required: true
